[package]
name = "pagrysha-launcher"
version = "7.2.1"
description = "Pagrysha Launcher"
authors = ["Pagrysha <support@pagrysha.com>"]
edition = "2021"

[workspace]
members = ["core"]

# Тесты живут в `pagrysha-core`: у этого крейта нет Tauri, поэтому его тестовый
# бинарник запускается. У тестового бинарника приложения нет манифеста
# comctl32 v6, и он падает до старта, так что свои тестовые цели здесь выключены,
# чтобы `cargo test` не собирал заведомо нерабочий файл.
[lib]
name = "pagrysha_launcher_lib"
crate-type = ["rlib"]
test = false

[[bin]]
name = "pagrysha-launcher"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
pagrysha-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
dirs = "5"
open = "5"
sysinfo = "0.33"
futures-util = "0.3"
regex = "1"
rfd = "0.15"
base64 = "0.22"
urlencoding = "2.1"
