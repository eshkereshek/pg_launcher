name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: ''
          - name: Linux
            os: ubuntu-22.04
            target: ''
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS dependencies
        run: npm ci

      # Ключи ИИ приходят из секретов репозитория и живут только на раннере:
      # в репозиторий файл не коммитится (он в .gitignore).
      - name: Write AI keys
        shell: bash
        run: |
          : > src-tauri/.keys.local
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> src-tauri/.keys.local
          fi
          if [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> src-tauri/.keys.local
          fi
      - name: Build Tauri bundles
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --target ${{ matrix.target }}
          elif [ "$RUNNER_OS" = "Linux" ]; then
            npx tauri build --bundles deb
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npx tauri build --no-bundle
          else
            npx tauri build
          fi


      - name: Install MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @("C:\msys64\mingw64\bin", "C:\mingw64\bin", "C:\ProgramData\mingw64\bin", "C:\ProgramData\chocolatey\bin")
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if (-not $found) {
            choco install mingw --no-progress -y
            $found = "C:\ProgramData\mingw64\bin"
            if (-not (Test-Path (Join-Path $found "gcc.exe"))) { $found = "C:\ProgramData\chocolatey\bin" }
          }
          if (-not (Test-Path (Join-Path $found "gcc.exe"))) { throw "gcc не найден ни в одном из путей" }
          "MINGW_BIN=$found" >> $env:GITHUB_ENV
          $found >> $env:GITHUB_PATH
          Write-Host "MinGW: $found"

      # Свой установщик вместо NSIS: один exe, внутри приложение и
      # WebView2Loader.dll, при запуске разворачивается во временную папку.
      - name: Build custom installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mingw = $env:MINGW_BIN
          Copy-Item "src-tauri\target\release\pagrysha-launcher.exe" "Pagrysha_Launcher_Setup.exe" -Force
          # В репозитории лежит копия: бандлер создаёт DLL не во всех режимах.
          $dll = "installer\WebView2Loader.dll"
          if (-not (Test-Path $dll)) { $dll = "src-tauri\target\release\WebView2Loader.dll" }
          if (-not (Test-Path $dll)) { throw "Не найден WebView2Loader.dll" }
          Copy-Item $dll "WebView2Loader.dll" -Force
          & "$mingw\windres.exe" -i installer.rc -o installer_res.o
          & "$mingw\gcc.exe" -O2 -mwindows installer_main.c installer_res.o -o "Pagrysha_Setup.exe"
          if (-not (Test-Path "Pagrysha_Setup.exe")) { throw "Установщик не собрался" }
          Remove-Item installer_res.o -Force
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          Copy-Item "Pagrysha_Setup.exe" "staged\Pagrysha_Setup.exe" -Force

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staged
          find src-tauri/target -path "*/release/bundle/*" -name "*.deb" -exec cp {} staged/ \;
          find src-tauri/target -path "*/release/bundle/*" -name "*.dmg" -exec cp {} staged/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ matrix.target || 'default' }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Pagrysha Launcher ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md --verify-tag