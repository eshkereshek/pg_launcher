name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: ''
          - name: Linux
            os: ubuntu-22.04
            target: ''
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri bundles
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --target ${{ matrix.target }}
          elif [ "$RUNNER_OS" = "Linux" ]; then
            npx tauri build --bundles deb
          else
            npx tauri build
          fi

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staged
          find src-tauri/target -path '*/release/bundle/*' \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} staged/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}-${{ matrix.target || 'default' }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Pagrysha Launcher ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md --verify-tag