name: Build Launcher Multiplatform

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-deb:
    name: Linux DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Linux DEB
        run: npx tsc -b && npx vite build && npx electron-builder --linux deb --publish never

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagrysha-launcher-linux-deb
          path: dist-build/*.deb

  build-mac-intel:
    name: macOS Intel (x64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build for macOS Intel (x64)
        run: npx tsc -b && npx vite build && npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pagrysha-launcher-mac-intel
          path: |
            dist-build/*.dmg
            dist-build/*.zip

  build-mac-arm:
    name: macOS Apple Silicon (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build for macOS ARM (arm64)
        run: npx tsc -b && npx vite build && npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS ARM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pagrysha-launcher-mac-arm
          path: |
            dist-build/*.dmg
            dist-build/*.zip

  build-windows:
    name: Windows Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build for Windows (Portable EXE)
        run: npx tsc -b && npx vite build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagrysha-launcher-win-portable
          path: dist-build/*.exe

  release:
    name: Create GitHub Release
    needs: [build-linux-deb, build-mac-intel, build-mac-arm, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
